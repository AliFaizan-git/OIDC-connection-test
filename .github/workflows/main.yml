name: Deploy to AWS via OIDC

on:
  push:
    branches:
      - main
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write   # OIDC JWT token generate karne ke liye compulsory hai
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claim
        run: |
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          JWT=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          echo "=========================================="
          echo "EXACT SUB CLAIM SENT BY GITHUB IS:"
          echo $JWT | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.sub'
          echo "=========================================="

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::931814980669:role/GitHubActions-Deployment-Rolee
          aws-region: eu-north-1
          role-session-name: GitHubActionsSession

      - name: Test AWS Connection
        run: |
          aws s3 ls
